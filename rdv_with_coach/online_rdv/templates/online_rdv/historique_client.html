{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>Historique de vos séances</h2>

{% for seance in seances %}
<div class="seance-cards">
    <div class="seance-card">
    <h3>Séance du {{ seance.date }}</h3>
    <p><span class="seance-element"> Avec :</span> {{ seance.coach }}</p>
    <p><span class="seance-element"> Objet :</span> {{ seance.objet }}</p>
    <a href="{% url 'online_rdv:seance_detail' seance.id %}" class="btn-detail">Détails</a>
    </div>
</div>
{% endfor %}

{% endblock %}
